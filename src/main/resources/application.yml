api:
  base:
    url: https://jsonplaceholder.typicode.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    env:
      show-values: when-authorized
  metrics:
    enable:
      jvm: true
      process: true
      system: true
  info:
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false